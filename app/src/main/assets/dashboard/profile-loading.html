<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IAmax</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% 20%, #1e1038 0%, #0b0617 55%, #05030c 100%);
      color: #e9e5ff;
      overflow: hidden;
      user-select: none;
    }
    .b { text-align: center; padding: 28px 24px; min-width: 280px; }
    .t {
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.12em;
      color: #c4b5fd;
      text-shadow: 0 0 24px rgba(167, 139, 250, 0.45);
    }
    .s { margin-top: 12px; font-size: 13px; color: #a5b4fc; min-height: 1.4em; }
    .r {
      width: 36px; height: 36px; margin: 18px auto 0;
      border: 3px solid rgba(167, 139, 250, 0.22);
      border-top-color: #a78bfa;
      border-right-color: rgba(34, 211, 238, 0.7);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.25);
    }
    .bar {
      width: 200px; height: 4px; margin: 16px auto 0;
      border-radius: 99px; background: rgba(255, 255, 255, 0.06); overflow: hidden;
    }
    .bar > i {
      display: block; height: 100%; width: 35%; border-radius: 99px;
      background: linear-gradient(90deg, #22d3ee, #a78bfa, #f0abfc);
      animation: slide 1.1s ease-in-out infinite;
    }
    .hint { margin-top: 14px; font-size: 11px; color: #64748b; line-height: 1.35; max-width: 300px; margin-left: auto; margin-right: auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div class="b">
    <div class="t">IAmax</div>
    <div class="r"></div>
    <div class="s" id="msg">Abriendo perfil…</div>
    <div class="bar"><i></i></div>
    <div class="hint" id="hint">Si se queda más de 20 s, cierra esta ventana y reintenta. En Mac Intel usa Chromium lite.</div>
  </div>
  <script>
    var msgs = [
      'Abriendo perfil…',
      'Conectando con la nube…',
      'Restaurando sesión…',
      'Iniciando Chromium…',
      'Casi listo…'
    ];
    var i = 0;
    setInterval(function () {
      i = (i + 1) % msgs.length;
      var el = document.getElementById('msg');
      if (el) el.textContent = msgs[i];
    }, 1800);
  </script>
</body>
</html>
