name: Build IAmax Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x gradlew

      - name: Compilar APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Renombrar APK para descarga directa
        run: cp app/build/outputs/apk/debug/app-debug.apk IAmax-Launcher-v1.3.8.apk

      - name: Subir APK compilada como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: IAmax-Launcher-v1.3.8-APK
          path: IAmax-Launcher-v1.3.8.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar Release directa con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.8
          name: IAmax Launcher v1.3.8
          files: IAmax-Launcher-v1.3.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
